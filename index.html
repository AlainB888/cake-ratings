<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cake Ratings">
  <title>Cake Ratings</title>
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg-color: #F2F2F7;
      --surface: #FFFFFF;
      --tint: #007AFF;
      --border: #C6C6C8;
      --text-main: #000000;
      --text-muted: #8E8E93;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body { 
      margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      background: var(--bg-color); color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    .app-container { display: flex; flex-direction: column; height: 100%; width: 100%; padding-bottom: env(safe-area-inset-bottom); }
    
    /* Header */
    .header { 
      padding: max(env(safe-area-inset-top), 20px) 20px 12px 20px; 
      background: var(--surface); border-bottom: 0.5px solid var(--border); 
      text-align: center; flex-shrink: 0; z-index: 100;
    }
    .app-title { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.4px; }

    /* Views */
    .view-container { 
      flex-grow: 1; overflow: hidden; display: none; background: var(--bg-color);
    }
    .view-container.active { display: flex; flex-direction: column; }

    /* --- Editor Table --- */
    .table-wrapper { 
      flex: 1; overflow-y: auto; overflow-x: auto; -webkit-overflow-scrolling: touch; 
      background: var(--surface); 
    }
    table { width: 100%; border-collapse: separate; border-spacing: 0; }
    th, td { 
      padding: 14px 12px; text-align: center; white-space: nowrap; 
      border-bottom: 0.5px solid var(--border); border-right: 0.5px solid var(--border);
      background-clip: padding-box; 
    }
    
    /* Sticky Layout Rules */
    th { background: #F9F9F9; position: sticky; top: 0; z-index: 10; font-weight: 600; color: var(--text-main); }
    td.flavor-name { 
      background: #F9F9F9; position: sticky; left: 0; z-index: 10; 
      text-align: left; font-weight: 600; font-size: 15px; 
    }
    th:first-child { position: sticky; left: 0; z-index: 20; }
    
    th.person-header { color: var(--text-muted); transition: color 0.2s; cursor: pointer; }
    th.person-header.selected { color: var(--tint); background: #E5F1FF; }

    /* Score Cells */
    .score-cell { font-weight: 600; user-select: none; transition: filter 0.2s; color: transparent !important; }
    .score-cell[data-score="0"] { background: var(--surface); }
    .score-cell[data-score="1"] { background: #194c7b; }
    .score-cell[data-score="2"] { background: #ad011a; }
    .score-cell[data-score="3"] { background: #ffcc00; }
    .score-cell[data-score="4"] { background: #33a331; }
    .score-cell[data-score="-1"] { background: #212529; }
    
    .score-cell.locked { pointer-events: none; }
    .score-cell.active-col { filter: brightness(0.85); }

    /* --- Chart --- */
    .chart-scroll { flex: 1; overflow-y: auto; padding: 20px; background: var(--surface); }
    .chart-container { height: auto; min-height: 2000px; width: 100%; }

    /* --- Settings --- */
    .settings-scroll { flex: 1; overflow-y: auto; padding: 20px; }
    .ios-list { 
      background: var(--surface); border-radius: 10px; margin-bottom: 24px; 
      overflow: hidden; border: 0.5px solid var(--border);
    }
    .ios-list button, .ios-list label { 
      display: block; width: 100%; text-align: left; padding: 14px 16px; 
      background: transparent; border: none; font-size: 17px; 
      color: var(--tint); border-bottom: 0.5px solid var(--border); 
      font-family: inherit; cursor: pointer;
    }
    .ios-list button:last-child, .ios-list label:last-child { border-bottom: none; }
    .ios-list button:active { background: #E5E5EA; }
    .list-title { font-size: 13px; text-transform: uppercase; color: var(--text-muted); margin: 0 0 8px 16px; }
    .text-danger { color: #FF3B30 !important; }

    /* --- Tab Bar --- */
    .tab-bar { 
      display: flex; background: #F9F9F9; border-top: 0.5px solid var(--border); 
      padding-bottom: env(safe-area-inset-bottom); height: calc(50px + env(safe-area-inset-bottom));
      flex-shrink: 0;
    }
    .tab-item { 
      flex: 1; display: flex; align-items: center; justify-content: center; 
      font-size: 12px; font-weight: 500; color: var(--text-muted); cursor: pointer;
    }
    .tab-item.active { color: var(--tint); }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="header">
      <h1 class="app-title" id="app-title-display">Cake Ratings</h1>
    </div>

    <!-- Editor View -->
    <div id="view-editor" class="view-container active">
      <div id="table-wrapper" class="table-wrapper"></div>
    </div>

    <!-- Chart View -->
    <div id="view-chart" class="view-container">
       <div class="chart-scroll">
         <div class="chart-container">
           <canvas id="flavorChart"></canvas>
         </div>
       </div>
    </div>

    <!-- Settings View -->
    <div id="view-settings" class="view-container">
      <div class="settings-scroll">
        
        <div class="list-title">Manage Data</div>
        <div class="ios-list">
          <button onclick="addUser()">Add User</button>
          <button onclick="editUser()">Edit User</button>
          <button onclick="removeUser()" class="text-danger">Remove User</button>
          <button onclick="addFlavor()">Add Flavor</button>
        </div>

        <div class="list-title">Backup & Restore</div>
        <div class="ios-list">
          <button onclick="exportData()">Export Data (.json)</button>
          <label for="importFileInput">Import Data (.json)</label>
          <input type="file" id="importFileInput" accept=".json" style="display: none;" onchange="importData(this)" />
        </div>
        
      </div>
    </div>

    <!-- Bottom Tab Bar -->
    <div class="tab-bar">
      <div id="tab-editor" class="tab-item active" onclick="switchTab('editor')">Editor</div>
      <div id="tab-chart" class="tab-item" onclick="switchTab('chart')">Chart</div>
      <div id="tab-settings" class="tab-item" onclick="switchTab('settings')">Settings</div>
    </div>
  </div>

  <script>
    let appData = JSON.parse(localStorage.getItem('cakeRatingsData'));
    if (!appData || !appData.flavors) {
      appData = {
        "flavors": ["Chocolat noir 🍫", "Chocolat au lait 🍫", "Vanille", "Fraise 🍓"],
        "scores": [[0,0], [0,0], [0,0], [0,0]],
        "title": "Cake Ratings",
        "people": ["User 1", "User 2"]
      };
      localStorage.setItem('cakeRatingsData', JSON.stringify(appData));
    }

    let chartInstance = null;

    function renderTable() {
      const headers = appData.people.map((person, index) => 
        `<th class="person-header" data-person-index="${index}">${person}</th>`
      );
      
      const tableHtml = `
        <table>
          <thead><tr><th></th>${headers.join('')}</tr></thead>
          <tbody>
            ${appData.flavors.map((flavor, flavorIndex) => `
              <tr>
                <td class="flavor-name">${flavor}</td>
                ${appData.scores[flavorIndex].map((score, personIndex) => `
                  <td class="score-cell locked" 
                      data-flavor-index="${flavorIndex}" 
                      data-person-index="${personIndex}" 
                      data-score="${score || 0}"></td>
                `).join('')}
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
      
      document.getElementById('table-wrapper').innerHTML = tableHtml;
      attachTableListeners();
    }

    function attachTableListeners() {
      const tableContainer = document.getElementById('table-wrapper');
      const newContainer = tableContainer.cloneNode(true);
      tableContainer.parentNode.replaceChild(newContainer, tableContainer);

      newContainer.addEventListener('click', (event) => {
        const target = event.target;
        const wrapper = document.getElementById('table-wrapper');
        
        // Column selection and snapping
        if (target.classList.contains('person-header')) {
          const selectedIndex = target.dataset.personIndex;
          
          if (target.classList.contains('selected')) {
             target.classList.remove('selected');
             document.querySelectorAll('.score-cell').forEach(cell => {
               cell.classList.add('locked');
               cell.classList.remove('active-col');
             });
          } else {
             document.querySelectorAll('.person-header').forEach(h => h.classList.remove('selected'));
             target.classList.add('selected');
             
             document.querySelectorAll('.score-cell').forEach(cell => {
               cell.classList.add('locked');
               cell.classList.remove('active-col');
             });
             
             document.querySelectorAll(`.score-cell[data-person-index="${selectedIndex}"]`).forEach(cell => {
               cell.classList.remove('locked');
               cell.classList.add('active-col');
             });
             
             const flavorColWidth = document.querySelector('.flavor-name').offsetWidth || 150;
             wrapper.scrollTo({
               left: target.offsetLeft - flavorColWidth,
               behavior: 'smooth'
             });
          }
        }
        
        // Score iteration
        if (target.classList.contains('score-cell') && !target.classList.contains('locked')) {
          const MAX_SCORE = 4;
          const ALLERGIC_SCORE = -1;
          let currentScore = parseInt(target.dataset.score || '0', 10);
          
          let newScore = currentScore >= MAX_SCORE ? ALLERGIC_SCORE : 
                         currentScore === ALLERGIC_SCORE ? 0 : 
                         currentScore + 1;
                         
          target.dataset.score = newScore;
          
          const fIdx = parseInt(target.dataset.flavorIndex, 10);
          const pIdx = parseInt(target.dataset.personIndex, 10);
          appData.scores[fIdx][pIdx] = newScore;
          
          autoSave();
        }
      });
    }

    function autoSave() {
      localStorage.setItem('cakeRatingsData', JSON.stringify(appData));
      renderChart(); 
    }

    // --- User Management Methods ---
    function addUser() {
      const name = prompt("Enter new user's name:");
      if (!name || name.trim() === "") return;
      appData.people.push(name.trim());
      appData.scores.forEach(flavorRow => flavorRow.push(0));
      autoSave();
      renderTable();
    }

    function editUser() {
      const namesList = appData.people.map((p, i) => `${i + 1}: ${p}`).join("\n");
      const indexStr = prompt(`Enter the NUMBER of the user to edit:\n\n${namesList}`);
      if (!indexStr) return;
      const index = parseInt(indexStr, 10) - 1;
      
      if (isNaN(index) || index < 0 || index >= appData.people.length) {
        alert("Invalid selection.");
        return;
      }
      
      const newName = prompt("Enter new name for " + appData.people[index] + ":", appData.people[index]);
      if (newName && newName.trim() !== "") {
        appData.people[index] = newName.trim();
        autoSave();
        renderTable();
      }
    }

    function removeUser() {
      const namesList = appData.people.map((p, i) => `${i + 1}: ${p}`).join("\n");
      const indexStr = prompt(`Enter the NUMBER of the user to remove:\n\n${namesList}`);
      if (!indexStr) return;
      const index = parseInt(indexStr, 10) - 1;
      
      if (isNaN(index) || index < 0 || index >= appData.people.length) {
        alert("Invalid selection.");
        return;
      }

      if (confirm(`Are you sure you want to completely remove ${appData.people[index]} and all their scores?`)) {
        appData.people.splice(index, 1);
        appData.scores.forEach(row => row.splice(index, 1));
        autoSave();
        renderTable();
      }
    }

    function addFlavor() {
      const flavorsInput = prompt("Enter new flavors (comma separated):");
      if (!flavorsInput || flavorsInput.trim() === "") return;
      const newFlavors = flavorsInput.split(",").map(f => f.trim()).filter(f => f);
      const n_users = appData.people.length;
      newFlavors.forEach(flavor => {
        appData.flavors.push(flavor);
        appData.scores.push(new Array(n_users).fill(0));
      });
      autoSave();
      renderTable();
    }

    // --- Export / Import ---
    function exportData() {
      const dataStr = JSON.stringify(appData, null, 2);
      const blob = new Blob([dataStr], { type: "application/json" });
      const file = new File([blob], "cake-ratings.json", { type: "application/json" });

      // iOS Safari native share sheet bypasses download restrictions
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({
          files: [file],
          title: 'Cake Ratings Backup',
        }).catch(err => console.error("Export canceled or failed", err));
      } else {
        // Fallback
        const url = URL.createObjectURL(blob);
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", url);
        downloadAnchor.setAttribute("download", "cake-ratings.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        document.body.removeChild(downloadAnchor);
        URL.revokeObjectURL(url);
      }
    }

    function importData(fileInput) {
      if (!fileInput.files.length) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          if (imported.flavors && imported.scores && imported.people) {
            appData = imported;
            autoSave();
            renderTable();
            alert("Data imported successfully.");
          } else {
            alert("Invalid file structure.");
          }
        } catch (e) {
          alert("Error parsing file.");
        }
      };
      reader.readAsText(fileInput.files[0]);
    }

    // --- Charting ---
    function renderChart() {
      const avgScores = appData.scores.map(row => {
        const valid = row.filter(s => s > 0);
        return valid.length ? parseFloat((valid.reduce((a, b) => a + b, 0) / valid.length).toFixed(2)) : 0;
      });

      const sortedData = appData.flavors
        .map((flavor, i) => ({ flavor, score: avgScores[i] }))
        .sort((a, b) => b.score - a.score);

      const scoreToColor = score => {
        if (score >= 4) return '#33a331';
        if (score >= 3) return '#ffcc00';
        if (score >= 2) return '#ad011a';
        if (score >= 1) return '#194c7b';
        return '#e8e8e8';
      };

      if (chartInstance) chartInstance.destroy();
      
      const ctx = document.getElementById('flavorChart').getContext('2d');
      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: sortedData.map(item => item.flavor),
          datasets: [{
            data: sortedData.map(item => item.score),
            backgroundColor: sortedData.map(item => scoreToColor(item.score)),
            borderRadius: 6,
            barThickness: 'flex'
          }]
        },
        options: {
          indexAxis: 'y',
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { max: 4, ticks: { stepSize: 1 } },
            y: { ticks: { autoSkip: false, font: { size: 13 } } }
          }
        }
      });
    }

    function switchTab(tabId) {
      document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.tab-item').forEach(b => b.classList.remove('active'));
      document.getElementById(`view-${tabId}`).classList.add('active');
      document.getElementById(`tab-${tabId}`).classList.add('active');
    }

    document.addEventListener('DOMContentLoaded', () => {

      // Add inside the DOMContentLoaded listener or top-level script in index.html
      if (new URLSearchParams(window.location.search).get('export') === 'raw') {
        document.body.innerHTML = `<pre>${localStorage.getItem('cakeRatingsData')}</pre>`;
      }
      
      renderTable();
      renderChart();
    });
  </script>
</body>
</html>
